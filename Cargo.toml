[workspace]
members = ["crates/t3fleet-protocol", "crates/t3fleet-server", "crates/t3fleet-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "process", "signal", "time", "sync"] }
t3fleet-protocol = { path = "crates/t3fleet-protocol" }
t3fleet-server = { path = "crates/t3fleet-server" }
